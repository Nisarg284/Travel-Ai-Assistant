server:
  tomcat:
    threads:
      max: 10
      min-spare: 2

spring:
  application:
    name: Travel Assistant


sarvam:
  api-key: ${SARVAM_API_KEY:demo-key}
  model-name: ${AI_MODEL_NAME:sarvam-105b-conversations}
  base-url: ${AI_BASE_URL:https://api.sarvam.ai/v1}

qdrant:
  api-key: ${QDRANT_API_KEY:demo-key}
  host-name: ${QDRANT_HOST_NAME:localhost}
  port: ${QDRANT_PORT:6334}
  collection-name: ${QDRANT_COLLECTION:travel-ai-ingestor}

unsplash:
  api-key: ${UNSPLASH_API_KEY:}
  secret-key: ${UNSPLASH_SECRET_KEY:}
  base-url: ${UNSPLASH_BASE_URL:https://api.unsplash.com}


management:
  endpoints:
    web:
      exposure:
        include: health

  endpoint:
    health:
      show-details: never



